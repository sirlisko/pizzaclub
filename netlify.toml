[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/pizza/-2016-07-29/"
  to = "/pizza/unknown-sardegna-2016-07-29/"
  status = 301

[[redirects]]
  from = "/pizzeria/pizzeria/"
  to = "/pizzeria/unknown-sardegna/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
